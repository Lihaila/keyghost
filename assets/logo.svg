<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="KeyGhost Logo">
  <defs>
    <!-- Squircle background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="52%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Soft top sheen -->
    <linearGradient id="bgSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Ambient glow behind ghost -->
    <radialGradient id="aura" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost frosted glass gradient -->
    <linearGradient id="ghostGrad" x1="25%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="65%" stop-color="#EEF2FF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.86"/>
    </linearGradient>

    <!-- Keycap top gradient -->
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Keycap base gradient -->
    <linearGradient id="keyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Letter A gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgSheen)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Luminous Aura -->
  <circle cx="128" cy="108" r="88" fill="url(#aura)"/>

  <!-- Floating Sparkles -->
  <g fill="#A5F3FC" opacity="0.9">
    <path d="M62 68 L64.5 74.5 L71 77 L64.5 79.5 L62 86 L59.5 79.5 L53 77 L59.5 74.5 Z"/>
    <path d="M196 58 L197.8 62.2 L202 64 L197.8 65.8 L196 70 L194.2 65.8 L190 64 L194.2 62.2 Z"/>
    <circle cx="188" cy="96" r="3" opacity="0.7"/>
  </g>

  <!-- Cute Frosted Ghost peeking/hovering above keycap -->
  <g filter="url(#shadow)">
    <path d="M84 114
             C84 78, 102 54, 128 54
             C154 54, 172 78, 172 114
             L172 146
             C172 152, 165 154, 160 149
             C155 144, 149 144, 144 149
             C139 154, 133 154, 128 149
             C123 144, 117 144, 112 149
             C107 154, 101 154, 96 149
             C91 144, 84 147, 84 140 Z"
          fill="url(#ghostGrad)"/>
    <!-- Subtle inner highlight -->
    <path d="M97 95 C97 73, 110 62, 128 62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- Expressive Eyes -->
    <ellipse cx="114" cy="96" rx="5.5" ry="7" fill="#1E1B4B"/>
    <ellipse cx="142" cy="96" rx="5.5" ry="7" fill="#1E1B4B"/>
    <!-- Eye catchlights -->
    <circle cx="112.2" cy="93.5" r="2" fill="#FFFFFF"/>
    <circle cx="140.2" cy="93.5" r="2" fill="#FFFFFF"/>
    <!-- Cute cheeks -->
    <ellipse cx="101" cy="106" rx="5" ry="3" fill="#67E8F9" opacity="0.65"/>
    <ellipse cx="155" cy="106" rx="5" ry="3" fill="#67E8F9" opacity="0.65"/>
    <!-- Friendly little smile -->
    <path d="M122 106 Q128 112 134 106" fill="none" stroke="#312E81" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Crisp Apple-style Keycap "A" in front -->
  <g filter="url(#shadow)">
    <!-- Keycap 3D base -->
    <rect x="76" y="130" width="104" height="82" rx="20" fill="url(#keyBase)"/>
    <!-- Keycap top surface -->
    <rect x="76" y="124" width="104" height="76" rx="18" fill="url(#keyTop)"/>
    <!-- Top rim sheen -->
    <rect x="77" y="125" width="102" height="74" rx="17" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Crisp bold letter "A" -->
    <text x="128" y="177"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif"
          font-size="46"
          font-weight="800"
          fill="url(#letterGrad)">A</text>
  </g>

  <!-- Little ghost hands resting on top edge of keycap -->
  <ellipse cx="96" cy="127" rx="10" ry="6.5" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
  <ellipse cx="160" cy="127" rx="10" ry="6.5" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
</svg>
