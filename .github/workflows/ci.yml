name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Universal Binary
        run: |
          mkdir -p build
          swiftc -O -target arm64-apple-macos13.0 Sources/main.swift -o build/auto-english-ime-arm64
          swiftc -O -target x86_64-apple-macos13.0 Sources/main.swift -o build/auto-english-ime-x86_64
          lipo -create -output build/auto-english-ime build/auto-english-ime-arm64 build/auto-english-ime-x86_64
          lipo -info build/auto-english-ime

      - name: Smoke Test
        run: |
          ./build/auto-english-ime --version
          ./build/auto-english-ime --help
