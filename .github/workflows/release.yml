name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Universal Binary (arm64 + x86_64)
        run: |
          mkdir -p build dist
          swiftc -O -target arm64-apple-macos13.0 Sources/main.swift -o build/keyghost-arm64
          swiftc -O -target x86_64-apple-macos13.0 Sources/main.swift -o build/keyghost-x86_64
          lipo -create -output build/keyghost build/keyghost-arm64 build/keyghost-x86_64
          lipo -info build/keyghost

      - name: Package Release Archive
        run: |
          tar -czf dist/keyghost-macos-universal.tar.gz -C build keyghost
          shasum -a 256 dist/keyghost-macos-universal.tar.gz > dist/keyghost-macos-universal.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/keyghost-macos-universal.tar.gz
            dist/keyghost-macos-universal.tar.gz.sha256
